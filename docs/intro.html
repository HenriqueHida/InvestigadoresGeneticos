<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Codon Guessing Game</title>
    <link rel="stylesheet" href="assets/css/styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" integrity="sha384-k6RqeWeci5ZR/Lv4MR0sA0FfDOMW4MDHujbU4lW25P5sbBLqRoRz6Gz4L5tYfE9L" crossorigin="anonymous">
    
    <!-- Scripts -->
    <script src="assets/js/firebase.js" type="module"></script>
    <script src="https://cdn.tiny.cloud/1/2jt1cuik6ds2i08040n9c4c4igidhw9artwxbhb5q1m7e4bo/tinymce/5/tinymce.min.js" referrerpolicy="origin"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/js/all.min.js"></script>
    <script src="assets/js/script.js"></script>
    <script src="assets/js/editor.js"></script>
    <script src="assets/js/editor-button.js"></script>
</head>
<body id="bodyJogo">
    <div id="user-info" style="position: absolute; top: 10px; right: 10px;">
        <span id="user-name-display"></span>
    </div>

    <h1 id="tituloSequenciamento">SEQUENCIAMENTO</h1>
    <p id="tituloDoGenoma">do genoma</p>
    <div id="wordle-game">
        <div class="center" id="board"></div>
        <div class="center"><button id="submit-button">ENVIAR</button></div>
        <div id="message"></div>
    </div>
    <div id="login-popup" class="popup">
        <div class="popup-content">
            <span class="close-btn" onclick="closePopup('login-popup')">&times;</span>
            <h2>Login</h2>
            <input type="email" id="login-email" placeholder="Email">
            <input type="password" id="login-password" placeholder="Senha">
            <button onclick="login()">Login</button>
        </div>
    </div>
    
    <div id="register-popup" class="popup">
        <div class="popup-content">
            <span class="close-btn" onclick="closePopup('register-popup')">&times;</span>
            <h2>Registrar</h2>
            <input type="text" id="register-name" placeholder="Nome">
            <input type="email" id="register-email" placeholder="Email">
            <input type="password" id="register-password" placeholder="Senha">
            <button onclick="register()">Registrar</button>
        </div>
    </div>
    
    <div id="logout-popup" class="popup">
        <div class="popup-content">
            <span class="close-btn" onclick="closePopup('logout-popup')">&times;</span>
            <h2>Logout</h2>
            <p>Você está logado como <span id="user-name-display"></span>.</p>
            <button onclick="logout()">Logout</button>
        </div>
    </div>
    
    <!-- Botões para abrir os popups -->
    <button onclick="openPopup('login-popup')">Login</button>
    <button onclick="openPopup('register-popup')">Registrar</button>
    
    <!-- TinyMCE Section -->
    <button id="toggle-editor-btn" class="editor-button"><i class="fas fa-edit"></i></button>
    <div id="editor-container" style="display: none;">
        <textarea id="editor"></textarea>
    </div>

    <a href="index.html"><button class="doc-link">COMO<br>JOGAR</button></a>
    
</body>
</html>
