<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wordle Game</title>
    <link rel="stylesheet" href="css/styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" integrity="sha384-k6RqeWeci5ZR/Lv4MR0sA0FfDOMW4MDHujbU4lW25P5sbBLqRoRz6Gz4L5tYfE9L" crossorigin="anonymous">
</head>
<body>
    <h1 class="center">Nosso Game de Wordle</h1>
    <p class="center">Jogo inicial.</p>
    <div id="wordle-game">
        <div class="center" id="board"></div>
        <div class="center"><button id="submit-button">Submit</button></div>
        <div id="message"></div>
    </div>
    
    <!-- TinyMCE Section -->
    <button id="toggle-editor-btn" class="editor-button"><i class="fas fa-edit"></i></button>
    <div id="editor-container" style="display: none;">
        <textarea id="editor"></textarea>
    </div>

    <a href="index.html" class="doc-link">Visitar a documentação</a>

    <!-- Scripts -->

    <script src="scripts/script.js"></script>
    <script src="scripts/editor.js"></script>
    <script src="scripts/editor-button.js"></script>

</html>
